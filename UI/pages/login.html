<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>登录 - 五行水晶DIY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8B5CF6',
            secondary: '#F59E0B',
            accent: '#EC4899',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Noto Sans SC', sans-serif; }
    .gradient-bg {
      background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 50%, #F59E0B 100%);
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen" style="width: 393px; margin: 0 auto;">
  
  <!-- iOS 状态栏 -->
  <div class="bg-white sticky top-0 z-50">
    <div class="h-[54px] px-6 flex justify-between items-end pb-1">
      <span class="text-[15px] font-semibold">9:41</span>
      <div class="absolute left-1/2 -translate-x-1/2 top-[12px] w-[126px] h-[37px] bg-black rounded-[20px]"></div>
      <div class="flex items-center gap-1 text-sm">
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-full"></i>
      </div>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="px-6 pt-12 pb-8">
    
    <!-- Logo区域 -->
    <div class="text-center mb-10">
      <div class="w-20 h-20 mx-auto mb-4 rounded-2xl gradient-bg flex items-center justify-center shadow-lg">
        <i class="fas fa-gem text-white text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 mb-2">五行水晶DIY</h1>
      <p class="text-gray-500 text-sm">智能推荐 · 开运定制</p>
    </div>

    <!-- 登录表单 -->
    <div class="space-y-4">
      <!-- 手机号 -->
      <div>
        <div class="flex items-center bg-white border border-gray-200 rounded-xl px-4 py-3 focus-within:border-primary focus-within:ring-2 focus-within:ring-purple-100 transition">
          <i class="fas fa-mobile-alt text-gray-400 mr-3"></i>
          <input type="tel" placeholder="请输入手机号" class="flex-1 outline-none text-base" maxlength="11">
        </div>
      </div>

      <!-- 验证码 -->
      <div class="flex gap-3">
        <div class="flex-1 flex items-center bg-white border border-gray-200 rounded-xl px-4 py-3 focus-within:border-primary focus-within:ring-2 focus-within:ring-purple-100 transition">
          <i class="fas fa-shield-alt text-gray-400 mr-3"></i>
          <input type="text" placeholder="验证码" class="flex-1 outline-none text-base" maxlength="6">
        </div>
        <button class="px-4 py-3 bg-primary text-white rounded-xl text-sm font-medium whitespace-nowrap hover:opacity-90 transition">
          获取验证码
        </button>
      </div>

      <!-- 登录按钮 -->
      <button class="w-full py-4 gradient-bg text-white rounded-xl text-base font-semibold shadow-lg hover:opacity-90 transition mt-6">
        登录 / 注册
      </button>

      <!-- 分隔线 -->
      <div class="flex items-center my-6">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="px-4 text-xs text-gray-400">其他登录方式</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <!-- 微信登录 -->
      <button class="w-full py-3.5 bg-[#07C160] text-white rounded-xl text-base font-medium flex items-center justify-center gap-2 hover:opacity-90 transition">
        <i class="fab fa-weixin text-xl"></i>
        <span>微信一键登录</span>
      </button>

      <!-- 用户协议 -->
      <div class="flex items-start gap-2 mt-6">
        <input type="checkbox" id="agreement" class="mt-1 accent-primary" checked>
        <label for="agreement" class="text-xs text-gray-500 leading-relaxed">
          登录即表示同意
          <a href="#" class="text-primary">《用户服务协议》</a>
          和
          <a href="#" class="text-primary">《隐私政策》</a>
        </label>
      </div>
    </div>

    <!-- 销售员工入口 -->
    <div class="text-center mt-12">
      <a href="staff-login.html" class="text-sm text-gray-500 hover:text-primary transition">
        我是销售员工 <i class="fas fa-arrow-right ml-1"></i>
      </a>
    </div>

  </div>

  <!-- 底部装饰 -->
  <div class="fixed bottom-0 left-0 right-0 h-32 pointer-events-none" style="width: 393px; margin: 0 auto;">
    <div class="absolute bottom-0 left-0 right-0 h-24 opacity-10">
      <div class="w-full h-full gradient-bg"></div>
    </div>
  </div>

</body>
</html>
