<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户管理 - 五行水晶DIY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, 'PingFang SC', sans-serif; }
  </style>
</head>
<body class="bg-gray-50" style="width: 393px; margin: 0 auto; min-height: 100vh;">
  
  <!-- 状态栏 -->
  <div class="bg-white sticky top-0 z-50">
    <div class="h-[54px] px-6 flex justify-between items-end pb-1">
      <span class="text-[15px] font-semibold">9:41</span>
      <div class="absolute left-1/2 -translate-x-1/2 top-[12px] w-[126px] h-[37px] bg-black rounded-[20px]"></div>
      <div class="flex items-center gap-1 text-sm">
        <i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i>
      </div>
    </div>
  </div>

  <!-- 导航栏 -->
  <div class="bg-white border-b px-4 py-3 flex items-center justify-between">
    <h1 class="font-semibold text-lg">客户管理</h1>
    <button class="text-sm text-gray-600"><i class="fas fa-filter mr-1"></i>筛选</button>
  </div>

  <!-- 统计 -->
  <div class="bg-white px-4 py-4 flex gap-3">
    <div class="flex-1 text-center p-3 bg-gray-50 rounded-xl">
      <p class="text-2xl font-bold text-gray-900">128</p>
      <p class="text-xs text-gray-500">总客户</p>
    </div>
    <div class="flex-1 text-center p-3 bg-green-50 rounded-xl">
      <p class="text-2xl font-bold text-green-600">42</p>
      <p class="text-xs text-gray-500">本月新增</p>
    </div>
    <div class="flex-1 text-center p-3 bg-amber-50 rounded-xl">
      <p class="text-2xl font-bold text-amber-600">15</p>
      <p class="text-xs text-gray-500">待跟进</p>
    </div>
  </div>

  <!-- 搜索 -->
  <div class="px-4 py-3 bg-white border-b">
    <div class="flex items-center bg-gray-100 rounded-xl px-4 py-2.5">
      <i class="fas fa-search text-gray-400 mr-2"></i>
      <input type="text" placeholder="搜索客户姓名、电话..." class="bg-transparent outline-none flex-1 text-sm">
    </div>
  </div>

  <!-- 标签筛选 -->
  <div class="px-4 py-3 flex gap-2 overflow-x-auto bg-white">
    <span class="px-3 py-1.5 bg-gray-900 text-white rounded-full text-xs whitespace-nowrap">全部</span>
    <span class="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-full text-xs whitespace-nowrap">木旺</span>
    <span class="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-full text-xs whitespace-nowrap">待跟进</span>
    <span class="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-full text-xs whitespace-nowrap">已转化</span>
    <span class="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-full text-xs whitespace-nowrap">高意向</span>
  </div>

  <!-- 客户列表 -->
  <div class="divide-y divide-gray-100 pb-24">
    <a href="staff-customer-detail.html" class="flex items-center px-4 py-4 bg-white">
      <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=80&h=80&fit=crop&crop=face" class="w-12 h-12 rounded-full">
      <div class="flex-1 ml-3">
        <div class="flex items-center gap-2 mb-1">
          <h3 class="font-medium text-gray-900">小美</h3>
          <span class="px-1.5 py-0.5 bg-green-100 text-green-600 text-[10px] rounded">木旺</span>
          <span class="px-1.5 py-0.5 bg-amber-100 text-amber-600 text-[10px] rounded">待跟进</span>
        </div>
        <p class="text-xs text-gray-500">八字: 木旺缺金 · 最后跟进: 2天前</p>
      </div>
      <i class="fas fa-chevron-right text-gray-300"></i>
    </a>
    
    <a href="#" class="flex items-center px-4 py-4 bg-white">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&h=80&fit=crop&crop=face" class="w-12 h-12 rounded-full">
      <div class="flex-1 ml-3">
        <div class="flex items-center gap-2 mb-1">
          <h3 class="font-medium text-gray-900">王女士</h3>
          <span class="px-1.5 py-0.5 bg-blue-100 text-blue-600 text-[10px] rounded">水旺</span>
          <span class="px-1.5 py-0.5 bg-green-100 text-green-600 text-[10px] rounded">已转化</span>
        </div>
        <p class="text-xs text-gray-500">消费: ¥2,580 · 最后跟进: 昨天</p>
      </div>
      <i class="fas fa-chevron-right text-gray-300"></i>
    </a>
    
    <a href="#" class="flex items-center px-4 py-4 bg-white">
      <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=80&h=80&fit=crop&crop=face" class="w-12 h-12 rounded-full">
      <div class="flex-1 ml-3">
        <div class="flex items-center gap-2 mb-1">
          <h3 class="font-medium text-gray-900">张先生</h3>
          <span class="px-1.5 py-0.5 bg-red-100 text-red-600 text-[10px] rounded">火旺</span>
          <span class="px-1.5 py-0.5 bg-purple-100 text-purple-600 text-[10px] rounded">高意向</span>
        </div>
        <p class="text-xs text-gray-500">八字: 火旺缺水 · 最后跟进: 今天</p>
      </div>
      <i class="fas fa-chevron-right text-gray-300"></i>
    </a>
    
    <a href="#" class="flex items-center px-4 py-4 bg-white">
      <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=80&h=80&fit=crop&crop=face" class="w-12 h-12 rounded-full">
      <div class="flex-1 ml-3">
        <div class="flex items-center gap-2 mb-1">
          <h3 class="font-medium text-gray-900">李女士</h3>
          <span class="px-1.5 py-0.5 bg-amber-100 text-amber-600 text-[10px] rounded">土旺</span>
        </div>
        <p class="text-xs text-gray-500">八字: 土旺缺木 · 最后跟进: 5天前</p>
      </div>
      <i class="fas fa-chevron-right text-gray-300"></i>
    </a>
  </div>

  <!-- 底部Tab -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t z-50" style="width: 393px; margin: 0 auto;">
    <div class="flex justify-around items-start pt-2 pb-8">
      <a href="staff-customers.html" class="flex flex-col items-center text-gray-900">
        <i class="fas fa-users text-xl"></i><span class="text-[10px] mt-1">客户</span>
      </a>
      <a href="staff-performance.html" class="flex flex-col items-center text-gray-400">
        <i class="fas fa-chart-bar text-xl"></i><span class="text-[10px] mt-1">业绩</span>
      </a>
      <a href="staff-invite.html" class="flex flex-col items-center text-gray-400">
        <i class="fas fa-qrcode text-xl"></i><span class="text-[10px] mt-1">邀请</span>
      </a>
      <a href="#" class="flex flex-col items-center text-gray-400">
        <i class="fas fa-user text-xl"></i><span class="text-[10px] mt-1">我的</span>
      </a>
    </div>
  </div>

</body>
</html>
