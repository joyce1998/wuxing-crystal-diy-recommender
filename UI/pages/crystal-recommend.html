<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水晶推荐 - 五行水晶DIY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, 'PingFang SC', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-gray-50" style="width: 393px; margin: 0 auto; min-height: 100vh;">
  
  <!-- 状态栏 -->
  <div class="bg-white sticky top-0 z-50">
    <div class="h-[54px] px-6 flex justify-between items-end pb-1">
      <span class="text-[15px] font-semibold">9:41</span>
      <div class="absolute left-1/2 -translate-x-1/2 top-[12px] w-[126px] h-[37px] bg-black rounded-[20px]"></div>
      <div class="flex items-center gap-1 text-sm">
        <i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i>
      </div>
    </div>
  </div>

  <!-- 导航栏 -->
  <div class="bg-white border-b px-4 py-3 flex items-center">
    <a href="home.html" class="w-10 h-10 flex items-center justify-center -ml-2">
      <i class="fas fa-chevron-left text-gray-600"></i>
    </a>
    <h1 class="flex-1 text-center font-semibold text-lg -ml-10">水晶推荐</h1>
  </div>

  <!-- 内容 -->
  <div class="pb-24">
    
    <!-- 用户八字摘要 -->
    <div class="mx-4 mt-4 p-4 bg-white rounded-2xl shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full gradient-bg flex items-center justify-center text-white">
          <i class="fas fa-user"></i>
        </div>
        <div class="flex-1">
          <h3 class="font-semibold text-gray-900">张小明</h3>
          <p class="text-xs text-gray-500">木旺缺金 · 喜金火 · 忌木水</p>
        </div>
        <button class="text-primary text-sm">重新测算</button>
      </div>
    </div>

    <!-- 推荐标签 -->
    <div class="px-4 mt-4 flex gap-2 overflow-x-auto hide-scrollbar">
      <span class="px-4 py-2 bg-primary text-white rounded-full text-sm whitespace-nowrap">全部推荐</span>
      <span class="px-4 py-2 bg-white text-gray-600 rounded-full text-sm whitespace-nowrap">补金系列</span>
      <span class="px-4 py-2 bg-white text-gray-600 rounded-full text-sm whitespace-nowrap">旺财系列</span>
      <span class="px-4 py-2 bg-white text-gray-600 rounded-full text-sm whitespace-nowrap">招桃花</span>
    </div>

    <!-- 推荐列表 -->
    <div class="px-4 mt-4 space-y-4">
      
      <!-- 水晶卡片1 -->
      <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
        <div class="flex">
          <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=200&h=200&fit=crop" class="w-28 h-28 object-cover">
          <div class="flex-1 p-4">
            <div class="flex items-center gap-2 mb-1">
              <h3 class="font-semibold text-gray-900">白水晶手串</h3>
              <span class="px-2 py-0.5 bg-amber-100 text-amber-600 text-xs rounded-full">补金首选</span>
            </div>
            <p class="text-xs text-gray-500 mb-2">增强金能量，平衡五行</p>
            <div class="flex items-center justify-between">
              <span class="text-primary font-bold">¥299</span>
              <button class="px-3 py-1 bg-primary text-white rounded-full text-xs">查看详情</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 水晶卡片2 -->
      <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
        <div class="flex">
          <img src="https://images.unsplash.com/photo-1551122087-f99a80a2b66f?w=200&h=200&fit=crop" class="w-28 h-28 object-cover">
          <div class="flex-1 p-4">
            <div class="flex items-center gap-2 mb-1">
              <h3 class="font-semibold text-gray-900">黄水晶吊坠</h3>
              <span class="px-2 py-0.5 bg-red-100 text-red-600 text-xs rounded-full">旺财</span>
            </div>
            <p class="text-xs text-gray-500 mb-2">招财聚财，增强财运</p>
            <div class="flex items-center justify-between">
              <span class="text-primary font-bold">¥588</span>
              <button class="px-3 py-1 bg-primary text-white rounded-full text-xs">查看详情</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 水晶卡片3 -->
      <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
        <div class="flex">
          <img src="https://images.unsplash.com/photo-1603561596112-0a132b757442?w=200&h=200&fit=crop" class="w-28 h-28 object-cover">
          <div class="flex-1 p-4">
            <div class="flex items-center gap-2 mb-1">
              <h3 class="font-semibold text-gray-900">粉水晶手链</h3>
              <span class="px-2 py-0.5 bg-pink-100 text-pink-600 text-xs rounded-full">招桃花</span>
            </div>
            <p class="text-xs text-gray-500 mb-2">增强人缘，招正桃花</p>
            <div class="flex items-center justify-between">
              <span class="text-primary font-bold">¥259</span>
              <button class="px-3 py-1 bg-primary text-white rounded-full text-xs">查看详情</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 水晶卡片4 -->
      <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
        <div class="flex">
          <img src="https://images.unsplash.com/photo-1615655406736-b37c4fabf923?w=200&h=200&fit=crop" class="w-28 h-28 object-cover">
          <div class="flex-1 p-4">
            <div class="flex items-center gap-2 mb-1">
              <h3 class="font-semibold text-gray-900">黑曜石手串</h3>
              <span class="px-2 py-0.5 bg-gray-100 text-gray-600 text-xs rounded-full">辟邪</span>
            </div>
            <p class="text-xs text-gray-500 mb-2">辟邪护身，消除负能量</p>
            <div class="flex items-center justify-between">
              <span class="text-primary font-bold">¥199</span>
              <button class="px-3 py-1 bg-primary text-white rounded-full text-xs">查看详情</button>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- 底部Tab Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 z-50" style="width: 393px; margin: 0 auto;">
    <div class="flex justify-around items-start pt-2 pb-8">
      <a href="home.html" class="flex flex-col items-center text-gray-400">
        <i class="fas fa-home text-xl"></i><span class="text-[10px] mt-1">首页</span>
      </a>
      <a href="bazi-input.html" class="flex flex-col items-center text-gray-400">
        <i class="fas fa-calculator text-xl"></i><span class="text-[10px] mt-1">测算</span>
      </a>
      <a href="crystal-recommend.html" class="flex flex-col items-center text-primary">
        <i class="fas fa-gem text-xl"></i><span class="text-[10px] mt-1">推荐</span>
      </a>
      <a href="messages.html" class="flex flex-col items-center text-gray-400">
        <i class="fas fa-comment-dots text-xl"></i><span class="text-[10px] mt-1">消息</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center text-gray-400">
        <i class="fas fa-user text-xl"></i><span class="text-[10px] mt-1">我的</span>
      </a>
    </div>
  </div>

</body>
</html>
