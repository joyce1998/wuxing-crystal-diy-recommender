<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>员工登录 - 五行水晶DIY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, 'PingFang SC', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #1F2937 0%, #374151 100%); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen" style="width: 393px; margin: 0 auto;">
  
  <!-- 状态栏 -->
  <div class="bg-gray-900 sticky top-0 z-50">
    <div class="h-[54px] px-6 flex justify-between items-end pb-1 text-white">
      <span class="text-[15px] font-semibold">9:41</span>
      <div class="absolute left-1/2 -translate-x-1/2 top-[12px] w-[126px] h-[37px] bg-black rounded-[20px]"></div>
      <div class="flex items-center gap-1 text-sm">
        <i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i>
      </div>
    </div>
  </div>

  <!-- 头部 -->
  <div class="gradient-bg px-6 py-10 text-center">
    <div class="w-16 h-16 mx-auto mb-3 bg-white/10 rounded-2xl flex items-center justify-center">
      <i class="fas fa-user-tie text-white text-2xl"></i>
    </div>
    <h1 class="text-xl font-bold text-white mb-1">销售员工登录</h1>
    <p class="text-sm text-gray-400">请使用工号或手机号登录</p>
  </div>

  <!-- 表单 -->
  <div class="px-6 -mt-4">
    <div class="bg-white rounded-2xl p-5 shadow-lg">
      <div class="space-y-4">
        <div>
          <label class="text-xs text-gray-500 mb-2 block">工号/手机号</label>
          <div class="flex items-center border border-gray-200 rounded-xl px-4 py-3 focus-within:border-gray-400">
            <i class="fas fa-id-badge text-gray-400 mr-3"></i>
            <input type="text" placeholder="请输入工号或手机号" class="flex-1 outline-none">
          </div>
        </div>
        <div>
          <label class="text-xs text-gray-500 mb-2 block">密码</label>
          <div class="flex items-center border border-gray-200 rounded-xl px-4 py-3 focus-within:border-gray-400">
            <i class="fas fa-lock text-gray-400 mr-3"></i>
            <input type="password" placeholder="请输入密码" class="flex-1 outline-none">
            <i class="fas fa-eye-slash text-gray-400"></i>
          </div>
        </div>
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-gray-500">
            <input type="checkbox" class="accent-gray-700" checked>
            记住登录
          </label>
          <a href="#" class="text-gray-500">忘记密码?</a>
        </div>
        <button onclick="location.href='staff-customers.html'" class="w-full py-4 bg-gray-900 text-white rounded-xl font-semibold">
          登 录
        </button>
      </div>
    </div>
    
    <div class="text-center mt-6">
      <a href="login.html" class="text-sm text-gray-500">
        <i class="fas fa-arrow-left mr-1"></i>返回客户登录
      </a>
    </div>
  </div>

</body>
</html>
